<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo: Union Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#1a2433;--ink2:#5f6b76;--ink3:#8a96a3;--brand:#2d5f7d;--brand-bg:#e3f0f8;--bg:#f2f4f7;--rule:#e3e8ed;--line:#c6cfd7;
 --head1:#1a4a6e;--head2:#0f2d45;--ease:cubic-bezier(.2,.8,.2,1);--t:300ms}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:15px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.head{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;flex:none;z-index:5}
.head-row{display:flex;align-items:center;justify-content:space-between;height:44px}
.head h1{font-size:19px;margin:0;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)} .icon-btn svg{width:22px;height:22px}
.gtabs{display:flex;margin-top:4px}
.gtabs button{padding:10px 12px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.6);border-bottom:2px solid transparent}
.gtabs button.on{color:#fff;border-color:#fff}
/* Partiful-style top tabs */
.tabs{position:relative;display:flex;gap:4px;padding:10px 14px 0;background:#fff;border-bottom:1px solid var(--rule);flex:none;z-index:4}
.tabs button{position:relative;padding:8px 10px 12px;font-size:17px;font-weight:700;color:var(--ink3);letter-spacing:-.01em;transition:color var(--t)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:3px;border-radius:3px;background:var(--ink);transition:left .3s var(--ease),width .3s var(--ease)}
.tabs .count{font-size:11px;font-weight:700;color:var(--ink3);margin-left:4px;vertical-align:top}
/* swipeable panels */
.panels{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.panels::-webkit-scrollbar{display:none}
.panel{flex:none;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;padding:14px 14px calc(110px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
/* cards */
.card{display:block;width:100%;background:#fff;border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(26,36,51,.06),0 8px 24px rgba(26,36,51,.06);transition:transform var(--t) var(--ease)}
.card:active{transform:scale(.985)}
.cover{position:relative;height:168px;display:flex;align-items:flex-end;padding:16px;color:#fff;overflow:hidden}
.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55))}
.cover h3{position:relative;z-index:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.cover .date{position:absolute;top:14px;left:14px;z-index:1;background:rgba(255,255,255,.92);color:var(--ink);border-radius:12px;padding:6px 10px;text-align:center;line-height:1;min-width:46px}
.cover .date b{display:block;font-size:18px;font-weight:800} .cover .date small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cover .pill{position:absolute;top:14px;right:14px;z-index:1;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.cover .deco{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 45% 80%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 20%,#fff 0 1.5px,transparent 2.5px);background-size:120px 120px}
.c-event{background:linear-gradient(135deg,#6a3fb5,#b05fa8)} .c-event2{background:linear-gradient(135deg,#1f3a93,#2d8fd5)} .c-offer{background:linear-gradient(135deg,#167a52,#5bc48a)} .c-offer2{background:linear-gradient(135deg,#b4541a,#f0a26a)} .c-ask{background:linear-gradient(135deg,#b7791f,#f2c94c)} .c-notice{background:linear-gradient(135deg,#3b4a5c,#7a8ea3)} .c-past{filter:saturate(.3) brightness(.9)}
.meta{display:flex;align-items:center;gap:10px;padding:12px 14px 14px}
.meta .av{width:28px;height:28px;font-size:10px}
.meta .t{flex:1;min-width:0;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .meta .t b{color:var(--ink);font-weight:600}
.faces{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);flex:none}
.faces .s{display:flex} .faces .s .av{width:24px;height:24px;font-size:8px;border:2px solid #fff;margin-left:-8px} .faces .s .av:first-child{margin-left:0}
.av{border-radius:50%;background:var(--brand-bg);color:var(--brand);font-weight:600;display:grid;place-items:center;flex:none}
.price{font-weight:800;font-size:15px;flex:none} .price small{font-weight:500;color:var(--ink2);font-size:11px;margin-left:2px}
/* small rows (offers/asks on explore, calendar) */
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:6px 6px 10px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(26,36,51,.05)}
.row .sw{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800}
.row .m{flex:1;min-width:0} .row .m b{display:block;font-size:15px;font-weight:600;line-height:1.3} .row .m span{font-size:12.5px;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.day{display:flex;gap:14px;margin:4px 0 8px;align-items:flex-start}
.day .d{flex:none;width:48px;text-align:center;padding-top:6px} .day .d b{display:block;font-size:22px;font-weight:800;line-height:1} .day .d small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.day .d.today b{color:var(--brand)}
.day .items{flex:1;min-width:0}
.empty{padding:50px 20px;text-align:center;color:var(--ink3);font-size:14px}
.fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(26,36,51,.35);z-index:1001;transition:transform var(--t) var(--ease)}
.fab:active{transform:scale(.95)} .fab svg{width:22px;height:22px}
.bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end;z-index:1002}
.bar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);width:90px}
.bar button.on{color:var(--brand)} .bar svg{width:24px;height:24px}
.bar .union{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--head1),var(--head2));margin-top:-26px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(15,45,69,.35)} .bar .union svg{width:28px;height:28px}
/* detail sheet */
.scrim{position:absolute;inset:0;background:rgba(11,18,32,.5);opacity:0;pointer-events:none;transition:opacity var(--t);z-index:1010} .scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .4s var(--ease);z-index:1011}
.sheet.on{transform:none}
.sheet .cover{height:210px;border-radius:24px 24px 0 0}
.sheet .cover h3{font-size:26px}
.sh-body{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.host{display:flex;align-items:center;gap:12px;margin-bottom:14px} .host .av{width:40px;height:40px;font-size:13px} .host b{display:block;font-size:15px} .host span{font-size:13px;color:var(--ink2)}
.facts{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:14px;background:var(--bg);border-radius:14px}
.fact{display:flex;gap:10px;align-items:center;font-size:14px} .fact svg{width:18px;height:18px;color:var(--ink2);flex:none}
.desc{font-size:15px;line-height:1.5;color:var(--ink);margin:0 0 16px}
.going{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13.5px;color:var(--ink2)} .going .s{display:flex} .going .s .av{width:30px;height:30px;font-size:10px;border:2px solid #fff;margin-left:-9px} .going .s .av:first-child{margin-left:0}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:15px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;background:var(--ink);color:#fff;transition:transform .15s var(--ease)} .btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto;padding:15px 18px}
.btn.done{background:var(--brand-bg);color:var(--brand)}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.7);margin:10px auto 0;position:relative;z-index:2}
/* compose */
.kinds{display:flex;gap:6px;margin:0 0 14px} .kinds button{flex:1;padding:10px 6px;border:1.5px solid var(--rule);border-radius:12px;font-size:13px;font-weight:700;color:var(--ink2);text-align:center} .kinds button.on{border-color:var(--ink);color:var(--ink)}
.f{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);margin-bottom:8px;outline:none} .f:focus{border-color:var(--ink);background:#fff}
.hintl{font-size:12.5px;color:var(--ink2);margin:4px 0 14px}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%) translateY(-10px);background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;transition:all var(--t);z-index:1020;pointer-events:none;white-space:nowrap} .toast.on{opacity:1;transform:translateX(-50%)}
.demo-pill{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:7;font-size:11px;background:#111;color:#fff;border-radius:999px;padding:5px 10px;opacity:.85;pointer-events:none;z-index:1003}
.pin{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;transition:transform .25s var(--ease)}
.pin.sel{transform:scale(1.35)} .pin.me{background:var(--brand);width:16px;height:16px;box-shadow:0 0 0 7px rgba(45,95,125,.22)}
.mapcard{position:absolute;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:1000;transform:translateY(130%);transition:transform .35s var(--ease)}
.mapcard.on{transform:none} .mapcard .card{margin:0;box-shadow:0 12px 32px rgba(0,0,0,.22)} .mapcard .cover{height:120px}
.leaflet-control-attribution{font-size:9px}
.card.in,.row.in{animation:drop .5s var(--ease)} @keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="head-row">
      <button class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1>The Velvet Tavern</h1>
      <span style="width:40px"></span>
    </div>
    <div class="gtabs"><button>Money</button><button>Members</button><button class="on">Board</button><button>Governance</button></div>
  </header>
  <div class="tabs" id="tabs">
    <button class="on" onclick="goTab(0)">Explore</button>
    <button onclick="goTab(1)">Calendar<span class="count" id="calCount"></span></button>
    <button onclick="goTab(2)">Past</button>
    <button onclick="goTab(3)">Map</button>
    <span class="ink" id="ink"></span>
  </div>
  <div class="panels" id="panels">
    <div class="panel" id="pExplore"></div>
    <div class="panel" id="pCal"></div>
    <div class="panel" id="pPast"></div>
    <div class="panel" id="pMap" style="padding:0;overflow:hidden;position:relative"><div id="map" style="position:absolute;inset:0"></div><div class="mapcard" id="mapcard"></div></div>
  </div>
  <button class="fab" onclick="openCompose()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Post</button>
  <nav class="bar">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.7-3.6 3.8-5.6 7.5-5.6s6.8 2 7.5 5.6"/></svg>Contacts</button>
    <button><span class="union"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></button>
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c.5-3 2.8-4.6 6-4.6s5.5 1.6 6 4.6M15.5 14.6c2.6.2 4.4 1.6 5 4.4"/></svg>Groups</button>
  </nav>
  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
  <div class="demo-pill">Demo · fake data</div>
</div>
<script>
const ME='jane';
const people={philip:'Philip Rosedale',jane:'Jane Rhee',ben:'Benjamin Ortiz',kaliya:'Kaliya Young',sara:'Sara Lim',ryan:'Ryan Park',tom:'Tom Nguyen',mark:'Mark Chen',ana:'Ana Silva',omar:'Omar Haddad'};
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join(''); const first=id=>people[id].split(' ')[0];
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=new Date(2026,10,16,12);
const D=(d,h,m)=>new Date(2026,10,d,h,m||0);
const K={event:{label:'Event',verb:'I’m going',done:'You’re going'},offer:{label:'Offer',verb:'I’ll take it',done:'You asked for it'},ask:{label:'Ask',verb:'I can help',done:'You offered'},notice:{label:'Notice',verb:'Got it',done:'Seen'}};
let posts=[
 {id:1,kind:'event',cover:'c-event',title:'Potluck on the roof',detail:'Bring a dish and something to pour. We’ll have the grill going. Kids welcome, dogs tolerated.',by:'philip',at:D(21,18),end:D(21,22),place:'447 Sutter St rooftop',ll:[37.7899,-122.4089],resp:['kaliya','sara','ben','omar','ana']},
 {id:6,kind:'event',cover:'c-event2',title:'Trivia night at the Tavern',detail:'Teams of 4. Winning team drinks on the house, paid in tokens of course.',by:'ben',at:D(19,20),end:D(19,23),place:'The Velvet Tavern',ll:[37.7881,-122.4058],resp:['jane','mark','kaliya','omar']},
 {id:11,kind:'event',cover:'c-event',title:'Sunday ride to Ocean Beach',detail:'Easy pace, coffee at the end. Meet at the Panhandle.',by:'mark',at:D(22,9),end:D(22,12),place:'Panhandle, Oak St',ll:[37.7726,-122.4430],resp:['tom']},
 {id:12,kind:'event',cover:'c-event2',title:'Members’ meeting: daily income vote',detail:'Twenty minutes. The vote closes at the end.',by:'philip',at:D(25,19),end:D(25,20),place:'The Velvet Tavern, back room',ll:[37.7883,-122.4056],resp:['jane','ben','sara']},
 {id:2,kind:'offer',cover:'c-offer',title:'Free: 4 monstera cuttings',detail:'Rooted, about a foot tall. Pick up from my porch any evening this week.',by:'sara',price:0,place:'Hayes Valley',ll:[37.7762,-122.4238],posted:D(15,19),resp:['mark']},
 {id:4,kind:'offer',cover:'c-offer2',title:'Haircuts at my chair, Tuesdays',detail:'I’m a barber on Valencia. Union members pay in tokens, walk-ins 2 to 5pm.',by:'omar',price:25,place:'Valencia St, Mission',ll:[37.7609,-122.4216],posted:D(14,10),resp:['tom','ana']},
 {id:3,kind:'ask',cover:'c-ask',title:'Anyone have a tall ladder I can borrow Sunday?',detail:'Need to reach a gutter. 10 ft or taller. Back Monday with beer.',by:'ryan',place:null,posted:D(15,16),resp:[]},
 {id:8,kind:'ask',cover:'c-ask',title:'Spanish conversation partner',detail:'An hour a week over coffee. Tokens or trade English practice.',by:'ana',price:10,place:null,posted:D(13,9),resp:['kaliya']},
 {id:5,kind:'notice',cover:'c-notice',title:'Daily income goes to 2 tokens from Monday',detail:'The vote passed. Nothing to do, it just shows up.',by:'philip',posted:D(15,11),resp:[]},
 {id:20,kind:'event',cover:'c-event',title:'Halloween at the Tavern',detail:'Costumes mandatory, judging at 10.',by:'ben',at:D(-1,20),end:D(-1,23),place:'The Velvet Tavern',resp:['jane','kaliya','sara','mark','omar','tom','ana']},
 {id:21,kind:'event',cover:'c-event2',title:'Founders’ dinner',detail:'The first twelve of us.',by:'philip',at:D(-10,19),end:D(-10,22),place:'Philip’s place',resp:['jane','ben','kaliya','sara']},
 {id:22,kind:'offer',cover:'c-offer',title:'Free couch, gone',detail:'Taken by Ryan.',by:'tom',price:0,place:'Dogpatch',posted:D(1,12),done:true,resp:['ryan']},
];
const fmtDate=d=>d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
const fmtTime=d=>d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(':00','');
const isPast=p=>p.done||(p.end&&p.end<NOW);
const mine=p=>p.resp.includes(ME);
function facesHtml(p){ if(!p.resp.length) return ''; const w=p.kind==='event'?'going':p.kind==='ask'?'can help':'interested'; return `<span class="faces"><span class="s">${p.resp.slice(0,3).map(r=>`<span class="av">${esc(ini(people[r]))}</span>`).join('')}</span>${p.resp.length} ${w}</span>`; }
function priceHtml(p){ if(p.price==null) return ''; return p.price===0?`<span class="price" style="color:var(--ink2);font-weight:700">Free</span>`:`<span class="price">${p.price}<small>tokens</small></span>`; }
function cardHtml(p,past){ const ev=p.kind==='event';
  return `<button class="card" onclick="openPost(${p.id})"><div class="cover ${p.cover}${past?' c-past':''}"><div class="deco"></div>
    ${ev?`<div class="date"><small>${p.at.toLocaleDateString([], {month:'short'})}</small><b>${p.at.getDate()}</b></div>`:''}
    ${!ev&&p.price!=null?`<div class="pill">${p.price===0?'Free':p.price+' tokens'}</div>`:''}
    ${past?`<div class="pill">${p.done?'Done':'Ended'}</div>`:(ev&&mine(p)?`<div class="pill">✓ Going</div>`:'')}
    <h3>${esc(p.title)}</h3></div>
    <div class="meta"><span class="av">${esc(ini(people[p.by]))}</span><span class="t"><b>${esc(first(p.by))}</b> · ${ev?`${fmtDate(p.at)}, ${fmtTime(p.at)}`:(p.place||K[p.kind].label)}</span>${facesHtml(p)}</div></button>`; }
function rowHtml(p){ const c={offer:'#1f8a5b',ask:'#b7791f',notice:'#5f6b76'}[p.kind]; const g={offer:'🎁',ask:'🙋',notice:'📌'}[p.kind];
  return `<button class="row" onclick="openPost(${p.id})"><span class="sw" style="background:${c}">${g}</span><span class="m"><b>${esc(p.title)}</b><span>${esc(first(p.by))}${p.place?' · '+esc(p.place):''}${p.resp.length?` · ${p.resp.length} ${p.kind==='ask'?'can help':'interested'}`:''}</span></span>${priceHtml(p)}</button>`; }
function renderExplore(){ const up=posts.filter(p=>!isPast(p));
  const events=up.filter(p=>p.kind==='event').sort((a,b)=>a.at-b.at);
  const rest=up.filter(p=>p.kind!=='event').sort((a,b)=>b.posted-a.posted);
  $('#pExplore').innerHTML=`<div class="sec">Coming up</div>${events.slice(0,2).map(p=>cardHtml(p)).join('')}
    <div class="sec" style="margin-top:14px">Offers and asks</div>${rest.map(rowHtml).join('')}
    ${events.length>2?`<div class="sec" style="margin-top:14px">More events</div>${events.slice(2).map(p=>cardHtml(p)).join('')}`:''}`; }
function renderCal(){ const ev=posts.filter(p=>p.kind==='event'&&!isPast(p)).sort((a,b)=>a.at-b.at); $('#calCount').textContent=ev.length;
  const days={}; ev.forEach(p=>{ const k=p.at.toDateString(); (days[k]=days[k]||[]).push(p); });
  $('#pCal').innerHTML=Object.entries(days).map(([k,list])=>{ const d=list[0].at; const today=d.toDateString()===NOW.toDateString();
    return `<div class="day"><div class="d${today?' today':''}"><small>${d.toLocaleDateString([], {weekday:'short'})}</small><b>${d.getDate()}</b></div><div class="items">${list.map(p=>`<button class="row" onclick="openPost(${p.id})"><span class="sw ${p.cover}" style="font-size:12px">${fmtTime(p.at).replace(' ','<br>')}</span><span class="m"><b>${esc(p.title)}</b><span>${esc(p.place||'')}${mine(p)?' · you’re going':p.resp.length?` · ${p.resp.length} going`:''}</span></span></button>`).join('')}</div></div>`; }).join('')||'<div class="empty">Nothing on the calendar yet.</div>'; }
function renderPast(){ const past=posts.filter(isPast).sort((a,b)=>(b.at||b.posted)-(a.at||a.posted)); $('#pPast').innerHTML=past.length?past.map(p=>cardHtml(p,true)).join(''):'<div class="empty">Nothing yet.</div>'; }
let map, pins={};
const COL={event:'#6a3fb5',offer:'#1f8a5b',ask:'#b7791f',notice:'#5f6b76'};
function ensureMap(){ if(map||!window.L) return; map=L.map('map',{zoomControl:false}).setView([37.781,-122.418],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap, © CARTO',maxZoom:19}).addTo(map);
  L.marker([37.7897,-122.4075],{icon:L.divIcon({className:'',html:'<div class="pin me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(map);
  map.on('click',()=>{ $('#mapcard').classList.remove('on'); Object.values(pins).forEach(m=>m.getElement()?.querySelector('.pin')?.classList.remove('sel')); }); }
function renderMap(){ if(!map) return; Object.values(pins).forEach(m=>map.removeLayer(m)); pins={};
  posts.filter(p=>p.ll&&!isPast(p)).forEach(p=>{ const lab=p.kind==='event'?p.at.getDate():''; const m=L.marker(p.ll,{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${COL[p.kind]}">${lab}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
    m.on('click',()=>{ Object.values(pins).forEach(x=>x.getElement()?.querySelector('.pin')?.classList.remove('sel')); m.getElement()?.querySelector('.pin')?.classList.add('sel'); $('#mapcard').innerHTML=cardHtml(p); $('#mapcard').classList.add('on'); map.panTo(p.ll,{animate:true}); }); pins[p.id]=m; }); }
function renderAll(){ renderExplore(); renderCal(); renderPast(); renderMap(); }
// tabs + swipe
let tab=0;
function placeInk(){ const b=$('#tabs').children[tab]; const ink=$('#ink'); ink.style.left=b.offsetLeft+10+'px'; ink.style.width=(b.offsetWidth-20)+'px'; }
function setTab(i){ tab=i; [...$('#tabs').querySelectorAll('button')].forEach((b,j)=>b.classList.toggle('on',j===i)); placeInk(); }
function goTab(i){ setTab(i); $('#panels').scrollTo({left:i*$('#panels').clientWidth,behavior:'smooth'}); if(i===3){ ensureMap(); setTimeout(()=>{ map&&map.invalidateSize(); renderMap(); },350); } }
$('#panels').addEventListener('scroll',()=>{ const i=Math.round($('#panels').scrollLeft/$('#panels').clientWidth); if(i!==tab){ setTab(i); if(i===3){ ensureMap(); setTimeout(()=>{ map&&map.invalidateSize(); renderMap(); },350); } } });
window.addEventListener('resize',placeInk);
// detail
function openPost(id){ const p=posts.find(x=>x.id===id); const ev=p.kind==='event'; const past=isPast(p); const k=K[p.kind];
  const I={cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-6-5.3-6-10a6 6 0 1112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>',tok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M9.5 10c0-1 1-1.8 2.5-1.8s2.5.8 2.5 1.8-1 1.5-2.5 1.8-2.5.8-2.5 1.8 1 1.8 2.5 1.8 2.5-.8 2.5-1.8M12 6.5v1.7M12 15.8v1.7"/></svg>'};
  $('#sheet').innerHTML=`<div class="cover ${p.cover}${past?' c-past':''}"><div class="deco"></div><div class="grab"></div><h3>${esc(p.title)}</h3></div>
   <div class="sh-body">
    <div class="host"><span class="av">${esc(ini(people[p.by]))}</span><div><b>${esc(people[p.by])}</b><span>${ev?'is hosting':p.kind==='ask'?'is asking':'posted this'}${p.posted?` · ${fmtDate(p.posted)}`:''}</span></div></div>
    <div class="facts">${ev?`<div class="fact">${I.cal}${fmtDate(p.at)} · ${fmtTime(p.at)} to ${fmtTime(p.end)}</div>`:''}${p.place?`<div class="fact"${p.ll?` style="cursor:pointer" onclick="closeSheet(); goTab(3); setTimeout(()=>{ map.setView(${JSON.stringify(p.ll)},15,{animate:true}); pins[${p.id}]?.fire('click'); },420)"`:''}>${I.pin}${esc(p.place)}${p.ll?' <span style="color:var(--brand);font-weight:600;margin-left:auto">Map ›</span>':''}</div>`:''}${p.price!=null?`<div class="fact">${I.tok}${p.price===0?'Free':p.price+' tokens, paid in the app'}</div>`:''}</div>
    <p class="desc">${esc(p.detail)}</p>
    ${p.resp.length?`<div class="going"><span class="s">${p.resp.slice(0,5).map(r=>`<span class="av">${esc(ini(people[r]))}</span>`).join('')}</span>${p.resp.map(first).slice(0,2).join(', ')}${p.resp.length>2?` and ${p.resp.length-2} more`:''} ${ev?'going':p.kind==='ask'?'can help':'interested'}</div>`:''}
    ${past?`<div class="btns"><button class="btn ghost" style="flex:1" onclick="closeSheet()">${p.done?'This one’s done':'This one’s over'}</button></div>`:
    `<div class="btns"><button class="btn${mine(p)?' done':''}" onclick="respond(${p.id})">${mine(p)?'✓ '+k.done:k.verb}</button><button class="btn ghost" onclick="toast('Demo: opens a message to ${esc(first(p.by))}')">Message</button></div>`}
   </div>`;
  $('#scrim').classList.add('on'); const sh=$('#sheet'); sh.scrollTop=0; sh.classList.add('on'); }
function respond(id){ const p=posts.find(x=>x.id===id); const i=p.resp.indexOf(ME); if(i>=0) p.resp.splice(i,1); else p.resp.push(ME); renderAll(); openPost(id); toast(i>=0?'Removed you':`${first(p.by)} gets a notification`); }
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
// compose
let ck='event';
function openCompose(){ $('#sheet').innerHTML=`<div class="sh-body" style="padding-top:12px"><div style="width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 16px"></div><h3 style="margin:0 0 14px;font-size:20px">New post</h3>
  <div class="kinds" id="kinds"></div>
  <input class="f" id="ct" placeholder="Title" maxlength="80">
  <input class="f" id="cd" placeholder="A line or two (optional)" maxlength="280">
  <div id="evf"><input class="f" id="cw" placeholder="When · e.g. Sat 6pm"><input class="f" id="cpl" placeholder="Where"></div>
  <input class="f" id="cp" placeholder="Price in tokens (blank = free)" inputmode="decimal" style="display:none">
  <p class="hintl">Everyone in The Velvet Tavern sees it. It moves to Past when it’s over or you mark it done.</p>
  <button class="btn" style="width:100%" onclick="submitCompose()">Post</button></div>`; renderKinds(); $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); }
function renderKinds(){ $('#kinds').innerHTML=Object.entries(K).map(([k,v])=>`<button class="${ck===k?'on':''}" onclick="ck='${k}';renderKinds()">${v.label}</button>`).join(''); $('#evf').style.display=ck==='event'?'block':'none'; $('#cp').style.display=(ck==='offer'||ck==='ask')?'block':'none'; }
function submitCompose(){ const t=$('#ct').value.trim(); if(!t){ toast('Give it a title'); return; } const pr=$('#cp').value.trim();
  const p={id:Date.now(),kind:ck,cover:{event:'c-event2',offer:'c-offer',ask:'c-ask',notice:'c-notice'}[ck],title:t,detail:$('#cd').value.trim(),by:ME,resp:[],posted:NOW};
  if(ck==='event'){ p.at=D(23,18); p.end=D(23,21); p.place=$('#cpl').value.trim()||'TBD'; } else if(ck!=='notice'){ p.price=pr?Number(pr):(ck==='offer'?0:null); }
  posts.unshift(p); closeSheet(); renderAll(); goTab(ck==='event'?1:0); toast('Posted. The group gets a notification.'); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
renderAll(); requestAnimationFrame(placeInk);
</script>
</body>
</html>
