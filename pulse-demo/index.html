<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo: Union Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2433; --ink2:#5f6b76; --ink3:#8a96a3; --brand:#2d5f7d; --brand-bg:#e3f0f8; --bg:#f2f4f7; --rule:#e3e8ed; --line:#c6cfd7;
  --green:#1f8a5b; --green-bg:#e4f5ec; --amber:#b7791f; --amber-bg:#fff4dc; --head1:#1a4a6e; --head2:#0f2d45;
  --ease:cubic-bezier(.2,.8,.2,1); --t:320ms;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:15px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.head{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;position:sticky;top:0;z-index:5}
.head-row{display:flex;align-items:center;justify-content:space-between;height:44px}
.head h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip svg{width:14px;height:14px}
.tabs{display:flex;gap:18px;margin-top:6px}
.tabs button{padding:10px 2px;font-size:14px;font-weight:600;color:rgba(255,255,255,.62);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:#fff}
main{flex:1;padding:0 0 calc(90px + env(safe-area-inset-bottom,0px))}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;margin:14px 14px 0;overflow:hidden}

/* hero rings */
.hero{position:relative;padding:10px 0 4px}
.hero svg{display:block;width:100%;height:auto}
.hero .node{cursor:pointer}
.hero .node circle.av{fill:var(--brand-bg);stroke:#fff;stroke-width:2;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}
.hero .node text{font-size:10px;font-weight:600;fill:var(--brand);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:opacity var(--t)}
.hero .node.root circle.av{fill:var(--brand)} .hero .node.root text{fill:#fff;font-size:13px}
.hero .ring{fill:none;stroke:var(--rule);stroke-width:1}
.hero .edge{fill:none;stroke:var(--line);stroke-width:1.2;transition:opacity var(--t)}
.hero.focus .edge{opacity:.25} .hero.focus .node{opacity:.35}
.hero.focus .edge.lit{opacity:1;stroke:var(--brand);stroke-width:2;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .6s var(--ease) forwards}
.hero.focus .node.lit{opacity:1}
.hero .node.newest circle.halo{fill:none;stroke:var(--brand);stroke-width:2;opacity:0;animation:halo 2.2s ease-out infinite}
@keyframes halo{0%{r:14;opacity:.6}100%{r:26;opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-cap{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 14px;font-size:12.5px;color:var(--ink2)}
.hero-cap b{color:var(--ink)}
.hero-cap button{color:var(--brand);font-weight:600;font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--rule)}
.stat{padding:12px 14px;border-right:1px solid var(--rule)} .stat:last-child{border-right:0}
.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:500;color:var(--ink2);margin-left:3px}
.stat .v.bump{animation:bump .45s var(--ease)}
@keyframes bump{30%{transform:translateY(-3px);color:var(--brand)}}

/* feed */
.feed-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 20px 6px}
.feed-h h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:600}
.feed-h span{font-size:12px;color:var(--ink3)}
.feed{list-style:none;margin:0 14px;padding:0}
.ev{background:#fff;border:1px solid var(--rule);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ev.in{animation:drop .5s var(--ease)}
@keyframes drop{from{transform:translateY(-14px);opacity:0;max-height:0}to{transform:none;opacity:1;max-height:200px}}
.ev-row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.pair{position:relative;width:64px;height:36px;flex:none}
.pair .av{position:absolute;top:2px;width:32px;height:32px}
.pair .av.a{left:0} .pair .av.b{right:0}
.pair svg{position:absolute;left:18px;top:0;width:28px;height:36px;overflow:visible}
.pair svg path{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:0}
.ev.in .pair svg path{stroke-dashoffset:60;animation:draw .55s .15s var(--ease) forwards}
.av{border-radius:50%;background:var(--brand-bg);color:var(--brand);font-weight:600;display:grid;place-items:center;font-size:12px;flex:none}
.av.solo{width:36px;height:36px;font-size:13px}
.av.mint{background:var(--green-bg);color:var(--green)} .av.vote{background:var(--amber-bg);color:var(--amber)}
.ev-main{flex:1;min-width:0}
.ev-t{font-size:14.5px;line-height:1.3} .ev-t b{font-weight:600}
.ev-s{font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-amt small{font-weight:500;color:var(--ink2);font-size:11px;margin-left:2px}
.ev-amt.plus{color:var(--green)}
.ev-x{max-height:0;overflow:hidden;transition:max-height var(--t) var(--ease)}
.ev.open .ev-x{max-height:160px}
.ev-xin{border-top:1px dashed var(--rule);padding:10px 14px 12px;font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 14px}
.ev-xin b{color:var(--ink);font-weight:600}
.mono{font-family:'Roboto Mono',monospace;font-size:11px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end;max-width:480px;margin:0 auto;z-index:5}
.bar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);width:80px}
.bar button.on{color:var(--brand)} .bar svg{width:24px;height:24px}
.bar .union{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--head1),var(--head2));margin-top:-26px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(15,45,69,.35)}
.bar .union svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(11,18,32,.45);opacity:0;pointer-events:none;transition:opacity var(--t);z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s var(--ease);z-index:21}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 16px}
.sh-head{display:flex;align-items:center;gap:14px}
.sh-head .av{width:54px;height:54px;font-size:18px}
.sh-name{font-size:18px;font-weight:600} .sh-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.chain-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:22px 0 10px}
.chain{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.chain::-webkit-scrollbar{display:none}
.chain .p{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:64px;opacity:0;transform:scale(.6)}
.chain .p .av{width:40px;height:40px;font-size:13px} .chain .p.root .av{background:var(--brand);color:#fff}
.chain .p span{font-size:11px;color:var(--ink2);white-space:nowrap}
.chain .l{flex:none;width:30px;height:2px;background:var(--rule);position:relative;margin-bottom:18px;overflow:hidden}
.chain .l:after{content:'';position:absolute;inset:0;background:var(--brand);transform:scaleX(0);transform-origin:left}
.sheet.on .chain .p{animation:pop .4s var(--ease) forwards}
.sheet.on .chain .l:after{animation:grow .3s var(--ease) forwards}
@keyframes pop{to{opacity:1;transform:none}} @keyframes grow{to{transform:none}}
.sh-note{font-size:13px;color:var(--ink2);margin-top:14px}
.sh-btn{display:block;width:100%;margin-top:18px;padding:14px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;text-align:center;font-size:15px}
.sh-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}

/* tree screen */
.screen{position:fixed;inset:0;background:var(--bg);z-index:30;max-width:480px;margin:0 auto;transform:translateX(100%);transition:transform .36s var(--ease);display:flex;flex-direction:column}
.screen.on{transform:none}
.screen .head{position:static}
.screen .head-row button{font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px}
.tree-wrap{flex:1;overflow:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.tree-cap{font-size:13px;color:var(--ink2);margin:0 6px 12px}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:28px;position:relative;overflow:hidden;max-height:2000px;transition:max-height .4s var(--ease),opacity .3s}
.tree li.closed>ul{max-height:0;opacity:0}
.tree ul:before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--rule)}
.tree li{position:relative}
.tree ul>li:before{content:'';position:absolute;left:-17px;top:24px;width:17px;height:2px;background:var(--rule)}
.tree li.lit>ul:before,.tree ul>li.lit:before{background:linear-gradient(90deg,var(--brand),#7fb3d5,var(--brand));background-size:200% 100%;animation:flow 1.1s linear infinite}
.tree li.lit-branch>ul:before{background:linear-gradient(180deg,var(--brand),#7fb3d5,var(--brand));background-size:100% 200%;animation:flowy 1.1s linear infinite}
@keyframes flow{to{background-position:-200% 0}} @keyframes flowy{to{background-position:0 -200%}}
.tn{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;width:100%;text-align:left;transition:opacity var(--t),background var(--t)}
.tn .av{width:36px;height:36px;font-size:12.5px} .tree>li>.tn .av{background:var(--brand);color:#fff}
.tn .n{font-weight:600;font-size:14.5px} .tn .s{font-size:12px;color:var(--ink2)}
.tn .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink2);background:var(--bg);border-radius:999px;padding:3px 8px;display:flex;align-items:center;gap:4px}
.tn .cnt svg{width:12px;height:12px;transition:transform var(--t)} li.closed .tn .cnt svg{transform:rotate(-90deg)}
.tree.focus .tn{opacity:.32} .tree.focus li.lit>.tn{opacity:1;background:var(--brand-bg)}
.tn .av.newest{box-shadow:0 0 0 0 rgba(45,95,125,.5);animation:ping 2.2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 12px rgba(45,95,125,0)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%) translateY(-10px);background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;transition:all var(--t);z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.demo-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;font-size:12px;background:#111;color:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} .chain .p{opacity:1;transform:none} .chain .l:after{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="head-row">
      <h1>Pulse</h1>
      <button class="chip" id="groupChip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.5-3 2.8-4.6 5.5-4.6s5 1.6 5.5 4.6"/></svg><span>The Velvet Tavern</span></button>
    </div>
    <div class="tabs"><button class="on">This group</button><button onclick="toast('Demo: all your groups in one feed')">All my groups</button></div>
  </header>
  <main>
    <section class="card">
      <div class="hero" id="hero"></div>
      <div class="hero-cap"><span><b id="memberCount">12</b> members · <b>4</b> generations from Philip</span><button onclick="openTree()">Family tree ›</button></div>
      <div class="stats">
        <div class="stat"><div class="k">Moved</div><div class="v" id="sMoved">0<small>tokens</small></div></div>
        <div class="stat"><div class="k">Minted</div><div class="v" id="sMint">0<small>tokens</small></div></div>
        <div class="stat"><div class="k">Fees</div><div class="v" id="sFee">0<small>tokens</small></div></div>
      </div>
    </section>
    <div class="feed-h"><h2>Today</h2><span id="feedNote">live</span></div>
    <ul class="feed" id="feed"></ul>
  </main>
  <nav class="bar">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.7-3.6 3.8-5.6 7.5-5.6s6.8 2 7.5 5.6"/></svg>Contacts</button>
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>Pulse</button>
    <button><span class="union"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c.5-3 2.8-4.6 6-4.6s5.5 1.6 6 4.6M15.5 14.6c2.6.2 4.4 1.6 5 4.4"/></svg>Groups</button>
  </nav>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

<div class="screen" id="treeScreen">
  <header class="head">
    <div class="head-row"><button onclick="closeTree()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Pulse</button><h1 style="font-size:17px">Family tree</h1><span style="width:60px"></span></div>
    <div style="height:12px"></div>
  </header>
  <div class="tree-wrap">
    <p class="tree-cap">Everyone in The Velvet Tavern and who vouched for them. Tap a person to see their chain back to Philip.</p>
    <ul class="tree" id="tree"></ul>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="demo-pill">Demo · fake data</div>

<script>
// ---- data: one sponsor each, rooted at the founder ----
const P = [
  ['philip','Philip Rosedale',null,'Mar 2025'],
  ['jane','Jane Rhee','philip','Apr 2025'],['ben','Benjamin Ortiz','philip','Apr 2025'],
  ['kaliya','Kaliya Young','jane','Jun 2025'],['sara','Sara Lim','jane','Jul 2025'],
  ['ryan','Ryan Park','ben','Jun 2025'],['tom','Tom Nguyen','ben','Aug 2025'],
  ['mark','Mark Chen','kaliya','Sep 2025'],['lee','Lee Okafor','sara','Oct 2025'],['ana','Ana Silva','sara','Oct 2025'],
  ['omar','Omar Haddad','ryan','Nov 2025'],['june','June Park','mark','Nov 2026'],
].map(([id,name,sponsor,since])=>({id,name,sponsor,since}));
const byId = Object.fromEntries(P.map(p=>[p.id,p]));
const kids = id => P.filter(p=>p.sponsor===id);
const ini = n => n.split(' ').slice(0,2).map(w=>w[0]).join('');
const first = id => byId[id].name.split(' ')[0];
const chainOf = id => { const c=[]; let cur=byId[id]; while(cur){ c.unshift(cur.id); cur = cur.sponsor ? byId[cur.sponsor] : null; } return c; };
const NEWEST='june';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- hero: radial tree, one ring per generation ----
function layout(){
  const pos={}; const size=id=>1+kids(id).reduce((a,k)=>a+size(k.id),0);
  const place=(id,a0,a1,depth)=>{ const mid=(a0+a1)/2; pos[id]={a:mid,d:depth}; let a=a0; const ks=kids(id); const tot=ks.reduce((s,k)=>s+size(k.id),0);
    ks.forEach(k=>{ const w=(a1-a0)*size(k.id)/tot; place(k.id,a,a+w,depth+1); a+=w; }); };
  place('philip',-Math.PI/2,Math.PI*1.5,0); return pos;
}
function renderHero(){
  const W=390,H=330,cx=W/2,cy=H/2,R=[0,42,76,110,144,178]; const pos=layout();
  const xy=id=>{ const p=pos[id]; return [cx+R[p.d]*Math.cos(p.a), cy+R[p.d]*Math.sin(p.a)]; };
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  R.slice(1).forEach(r=>s+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/>`);
  P.filter(p=>p.sponsor).forEach(p=>{ const [x1,y1]=xy(p.sponsor),[x2,y2]=xy(p.id); s+=`<path class="edge" data-to="${p.id}" d="M${x1} ${y1}L${x2} ${y2}"/>`; });
  P.forEach(p=>{ const [x,y]=xy(p.id); const r=p.sponsor?13:20;
    s+=`<g class="node${p.sponsor?'':' root'}${p.id===NEWEST?' newest':''}" data-id="${p.id}" onclick="focusHero('${p.id}')"><circle class="halo" cx="${x}" cy="${y}" r="14"/><circle class="av" cx="${x}" cy="${y}" r="${r}"/><text x="${x}" y="${y}">${ini(p.name)}</text></g>`; });
  $('#hero').innerHTML=s+'</svg>';
}
let heroFocus=null;
function focusHero(id){
  const h=$('#hero'); if(heroFocus===id){ h.classList.remove('focus'); heroFocus=null; h.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit')); return; }
  heroFocus=id; h.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit')); h.classList.add('focus');
  const c=chainOf(id); c.forEach(x=>{ h.querySelector(`.node[data-id="${x}"]`).classList.add('lit'); const e=h.querySelector(`.edge[data-to="${x}"]`); if(e){ e.classList.remove('lit'); void e.getBoundingClientRect(); e.classList.add('lit'); } });
  openSheet(id);
}

// ---- stats ----
const stats={moved:0,mint:0,fee:0};
function countTo(el,target,unit){ const start=Number(el.dataset.v||0); const t0=performance.now(); const dur=600;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur); const v=start+(target-start)*(1-Math.pow(1-k,3)); el.innerHTML=fmt(v)+`<small>${unit}</small>`; if(k<1) requestAnimationFrame(step); else { el.dataset.v=target; } };
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); requestAnimationFrame(step); }
const fmt=n=>{ n=Math.round(n*100)/100; return n%1===0?String(n):n.toFixed(2); };
function renderStats(){ countTo($('#sMoved'),stats.moved,'tokens'); countTo($('#sMint'),stats.mint,'tokens'); countTo($('#sFee'),stats.fee,'tokens'); }

// ---- feed ----
const FEE=0.02;
const seed=[
  {t:'pay',a:'jane',b:'philip',amt:20,memo:'2x Beer',when:'9:27 PM'},
  {t:'join',a:'june',by:'mark',when:'8:50 PM'},
  {t:'pay',a:'ryan',b:'sara',amt:12.5,memo:'Lunch at Tartine',when:'1:12 PM'},
  {t:'vote',what:'Daily income',val:'2 tokens',when:'11:03 AM'},
  {t:'mint',n:12,amt:2,when:'9:00 AM'},
  {t:'pay',a:'omar',b:'ben',amt:6,memo:'Coffee',when:'8:41 AM'},
];
const incoming=[
  {t:'pay',a:'kaliya',b:'jane',amt:9,memo:'Movie ticket'},
  {t:'pay',a:'tom',b:'philip',amt:30,memo:'Round for the table'},
  {t:'join',a:'nia',by:'ana',name:'Nia Brooks'},
  {t:'pay',a:'ana',b:'lee',amt:4.5,memo:'Bagel'},
];
function avatarHtml(id,cls){ const p=byId[id]; return `<span class="av ${cls||''}" onclick="event.stopPropagation(); openSheet('${id}')">${p?esc(ini(p.name)):'?'}</span>`; }
function evHtml(e){
  const when=e.when||new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  if(e.t==='pay'){ const fee=Math.round(e.amt*FEE*100)/100;
    return `<button class="ev-row" onclick="this.parentElement.classList.toggle('open')">
      <span class="pair">${avatarHtml(e.a,'a')}<svg viewBox="0 0 28 36"><path d="M2 18 C 10 6, 18 6, 26 18"/></svg>${avatarHtml(e.b,'b')}</span>
      <span class="ev-main"><div class="ev-t"><b>${esc(first(e.a))}</b> paid <b>${esc(first(e.b))}</b></div><div class="ev-s">${esc(e.memo)} · ${when}</div></span>
      <span class="ev-amt">${fmt(e.amt)}<small>tokens</small></span></button>
      <div class="ev-x"><div class="ev-xin"><span>From <b>${esc(byId[e.a].name)}</b></span><span>To <b>${esc(byId[e.b].name)}</b></span><span>Fee <b>${fmt(fee)}</b></span><span>${esc(byId[e.b].name.split(' ')[0])} received <b>${fmt(e.amt-fee)}</b></span><span class="mono">RECEIPT · ${when.toUpperCase()}</span></div></div>`; }
  if(e.t==='join'){ const nm=e.name||byId[e.a]?.name||'Someone';
    return `<div class="ev-row"><span class="av solo">${esc(ini(nm))}</span><span class="ev-main"><div class="ev-t"><b>${esc(nm.split(' ')[0])}</b> joined</div><div class="ev-s">vouched for by ${esc(first(e.by))} · ${when}</div></span><span class="ev-amt plus">+1<small>member</small></span></div>`; }
  if(e.t==='mint') return `<div class="ev-row"><span class="av solo mint">↓</span><span class="ev-main"><div class="ev-t">Daily income paid to <b>${e.n} people</b></div><div class="ev-s">${fmt(e.amt)} tokens each · ${when}</div></span><span class="ev-amt plus">+${fmt(e.n*e.amt)}<small>tokens</small></span></div>`;
  if(e.t==='vote') return `<div class="ev-row"><span class="av solo vote">✓</span><span class="ev-main"><div class="ev-t"><b>${esc(e.what)}</b> is now ${esc(e.val)}</div><div class="ev-s">median of 9 votes · ${when}</div></span></div>`;
  return '';
}
function addEvent(e,top){ const li=document.createElement('li'); li.className='ev'+(top?' in':''); li.innerHTML=evHtml(e); const f=$('#feed'); top?f.prepend(li):f.append(li);
  if(e.t==='pay'){ stats.moved+=e.amt; stats.fee+=Math.round(e.amt*FEE*100)/100; } if(e.t==='mint') stats.mint+=e.n*e.amt; }
function boot(){ renderHero(); seed.forEach(e=>addEvent(e,false)); renderStats();
  let i=0; const tick=()=>{ if(i>=incoming.length){ $('#feedNote').textContent='quiet'; return; } const e=incoming[i++]; if(e.t==='join'&&e.name){ P.push({id:e.a,name:e.name,sponsor:e.by,since:'now'}); byId[e.a]=P[P.length-1]; renderHero(); $('#memberCount').textContent=P.length; } addEvent(e,true); renderStats(); setTimeout(tick,5200+Math.random()*2500); };
  setTimeout(tick,3800); }

// ---- member sheet with chain ----
function openSheet(id){
  const p=byId[id]; const c=chainOf(id); const n=kids(id).length;
  const chain=c.map((x,i)=>`${i?`<span class="l" style="animation-delay:${i*0.14}s"></span>`:''}<span class="p${i?'':' root'}" style="animation-delay:${i*0.14+0.05}s"><span class="av">${esc(ini(byId[x].name))}</span><span>${esc(first(x))}</span></span>`).join('');
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="sh-head"><span class="av">${esc(ini(p.name))}</span><div><div class="sh-name">${esc(p.name)}</div><div class="sh-sub">${p.sponsor?`Vouched for by ${esc(first(p.sponsor))} · ${esc(p.since)}`:`Founder · ${esc(p.since)}`}</div></div></div>
    <div class="chain-h">${p.sponsor?`How ${esc(first(id))} got here`:'Where it starts'}</div>
    <div class="chain">${chain}</div>
    <div class="sh-note">${c.length-1===0?'Philip started the group.':`${c.length-1} ${c.length-1===1?'step':'steps'} from Philip.`} ${n?`${esc(first(id))} has vouched for ${n} ${n===1?'person':'people'}.`:`${esc(first(id))} hasn’t vouched for anyone yet.`}</div>
    <button class="sh-btn" onclick="closeSheet(); toast('Demo: this would open the Pay screen with ${esc(first(id))} filled in')">Pay ${esc(first(id))}</button>
    <button class="sh-btn ghost" onclick="closeSheet(); openTree('${id}')">See in the family tree</button>`;
  $('#scrim').classList.add('on'); const sh=$('#sheet'); sh.classList.remove('on'); void sh.offsetWidth; sh.classList.add('on');
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }

// ---- tree screen ----
function renderTree(){
  const node=p=>{ const ks=kids(p.id); return `<li data-id="${p.id}"><button class="tn" onclick="focusTree('${p.id}')"><span class="av${p.id===NEWEST?' newest':''}">${esc(ini(p.name))}</span><span><div class="n">${esc(p.name)}</div><div class="s">${p.sponsor?`vouched for by ${esc(first(p.sponsor))} · ${esc(p.since)}`:'founder'}</div></span>${ks.length?`<span class="cnt" onclick="event.stopPropagation(); this.closest('li').classList.toggle('closed')">${ks.length}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>`:''}</button>${ks.length?`<ul>${ks.map(node).join('')}</ul>`:''}</li>`; };
  $('#tree').innerHTML=node(byId.philip);
}
let treeFocus=null;
function focusTree(id){ const t=$('#tree'); t.querySelectorAll('.lit,.lit-branch').forEach(e=>e.classList.remove('lit','lit-branch'));
  if(treeFocus===id){ t.classList.remove('focus'); treeFocus=null; return; }
  treeFocus=id; t.classList.add('focus'); const c=chainOf(id);
  c.forEach((x,i)=>{ const li=t.querySelector(`li[data-id="${x}"]`); li.classList.add('lit'); li.classList.remove('closed'); if(i<c.length-1) li.classList.add('lit-branch'); });
  t.querySelector(`li[data-id="${id}"]`).scrollIntoView({block:'center',behavior:'smooth'}); }
function openTree(id){ renderTree(); $('#treeScreen').classList.add('on'); if(id) setTimeout(()=>focusTree(id),380); }
function closeTree(){ $('#treeScreen').classList.remove('on'); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
boot();
</script>
</body>
